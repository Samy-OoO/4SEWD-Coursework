<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inventory Management - Home</title>
        <style>
            *{
                font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            }
        </style>
        <link rel="stylesheet" href="style.css">
        <script src="js/data.js"></script>
        <script src="js/home.js"></script>
    </head>
    <body>
        <header>
            <nav>
                <a href="#">Home</a>
                <a href="products.htm">Products</a>
                <a href="suppliers.htm">Suppliers</a>
                <a href="adminLoginSecurity.htm" style="float:right" id="a-login">Log In</a>
                <a onclick="logout()" style="float:right" id="a-logout" style="display:none">Log Out</a>
            </nav>
        </header>
        <br>
        <h2 style="margin-left:15px;">Inventory Management System</h2>
        <br>
        <p style="margin-left:15px;">
            Use the navigation menu above to access your inventory dashboard.
        </p>

        <section class="dashboard-cards-list">
            <div class="dashboard-card">
                <div class="card-content">
                    <h3>Total products:</h3>
                    <p id="total-products"></p>
                </div>
            </div>
            <div class="dashboard-card">
                <div class="card-content">
                    <h3>Inventory value:</h3>
                    <p id="total-inventory-value"></p>
                </div>
            </div>
            <div class="dashboard-card">
                <div class="card-content">
                    <h3>Low Stock Items: </h3>
                    <p id="total-low-stock"></p>
                </div>
            </div>
            <div class="dashboard-card">
                <div class="card-content">
                    <h3>Suppliers:</h3>
                    <p id="total-suppliers"></p>
                </div>
            </div>
        </section>
