<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Product Form</title>
        <link rel="stylesheet" href="style.css">
        <script src="js/auth.js"></script>
        <script src="js/data.js"></script>
        <script src="js/supplierForm.js"></script>
    <body>
        <nav>
            <a href="home.htm">Home</a>
            <a href="products.htm">Products</a>
            <a href="suppliers.htm">Suppliers</a>
            <a onclick="logout()" style="float:right">Log Out</a>
        </nav>

        <div class="container">

            <div class="card">
                <h2>Add Supplier</h2>

                <br><hr><br>
                <form id="supplier-form">

                    <div class="form-group">
                        <label>Supplier Name</label>
                        <input type="text" name="supplier-name" id="sup-name" placeholder="Enter supplier name">
                    </div>

                    <div class="form-group">
                        <label>Description</label>
                        <textarea name="product-desc" id="supplier-desc"></textarea>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Contact Email</label>
                            <input type="email" name="email" id="sup-email" placeholder="example@gmail.com">
                        </div>

                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="tel" name="supplier-phone" id="sup-phone" placeholder="98XXXXXXXX">
                        </div>
                    </div>
                    <button>Save Supplier</button>
                </form>
            </div>
        </div>
    </body>
</html>
